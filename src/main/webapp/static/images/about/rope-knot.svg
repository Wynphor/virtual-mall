<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 115" role="img" aria-label="系木结回到顶部">
  <!-- 主绳：从顶垂下，微带弧度 -->
  <path d="M17 0 C17 8, 19 16, 18 24 C17.5 28, 18 30, 18 34"
        stroke="#222" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- 缠绕第1圈：偏大，略松 -->
  <path d="M18 34 C27 35, 31 40, 24 43 C17 46, 9 42, 11 37 C13 32, 17 33, 18 36"
        stroke="#222" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 缠绕第2圈：紧贴主绳，略小 -->
  <path d="M18 39 C25 40, 28 45, 21 48 C14 51, 8 47, 10 43 C12 39, 16 40, 18 43"
        stroke="#222" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 缠绕第3圈：最紧，收尾 -->
  <path d="M18 46 C24 47, 27 52, 20 55 C13 58, 7 54, 9 50 C11 46, 16 47, 18 50"
        stroke="#222" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 绳尾穿出，微微偏转 -->
  <path d="M18 50 C18 54, 17 58, 18 64"
        stroke="#222" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <!-- 底部挂圈：不规则水滴形，左边略鼓 -->
  <path d="M18 64
           C16 66, 8 74, 7 84
           C5.5 97, 16 106, 18 108
           C20 106, 31 97, 29.5 84
           C28 74, 20 66, 18 64"
        stroke="#222" stroke-width="2.6" fill="none" stroke-linecap="round"/>
</svg>
